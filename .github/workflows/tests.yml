name: CLIPS.ONTHE checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip fastapi python-multipart "yt-dlp[default]"
      - name: Compile Python files
        run: python -m py_compile main.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
